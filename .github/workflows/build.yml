name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          sdkmanager --list_installed
          adb version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Secrets Gradle Plugin files
        shell: bash
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          PROJECT_DIR="家族カレンダー (1)"
          ENV_EXAMPLE="$PROJECT_DIR/.env.example"
          ENV_FILE="$PROJECT_DIR/.env"

          # The Secrets Gradle Plugin expects a non-empty value so it can
          # generate a valid Java string literal in BuildConfig.java.
          if [ ! -s "$ENV_EXAMPLE" ] || ! grep -Eq '^GEMINI_API_KEY=.+$' "$ENV_EXAMPLE"; then
            printf '%s\n' \
              '# Optional local development secrets.' \
              '# Replace the placeholder with a real key in an untracked .env file.' \
              'GEMINI_API_KEY=CI_PLACEHOLDER_API_KEY' > "$ENV_EXAMPLE"
          fi

          API_KEY="${GEMINI_API_KEY_SECRET:-}"
          if [ -z "$API_KEY" ]; then
            API_KEY="CI_PLACEHOLDER_API_KEY"
            echo "GEMINI_API_KEY secret is not configured; using a build-only placeholder."
          else
            echo "Using GEMINI_API_KEY from GitHub Actions Secrets."
          fi

          # Create the primary properties file explicitly. It is generated
          # only on the runner and is never committed to the repository.
          printf 'GEMINI_API_KEY=%s\n' "$API_KEY" > "$ENV_FILE"

          test -s "$ENV_EXAMPLE"
          test -s "$ENV_FILE"
          if ! grep -Eq '^GEMINI_API_KEY=.+$' "$ENV_FILE"; then
            echo "ERROR: GEMINI_API_KEY is empty."
            exit 1
          fi
          echo "Secrets Gradle Plugin input files are ready."

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="家族カレンダー (1)"
          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating the standard Android debug keystore for CI."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug keystore found."
          fi

          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="家族カレンダー (1)"
          cd "$PROJECT_DIR"

          echo "Project directory: $(pwd)"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          gradle --version

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found. Using ./gradlew."
            chmod +x ./gradlew
            ./gradlew --no-daemon --no-build-cache --no-configuration-cache assembleDebug
          else
            echo "Gradle Wrapper script not found. Trying to generate it."
            if gradle wrapper --gradle-version 9.3.1 --distribution-type bin; then
              if [ -f "./gradlew" ]; then
                chmod +x ./gradlew
                ./gradlew --no-daemon --no-build-cache --no-configuration-cache assembleDebug
              else
                echo "Wrapper generation did not create gradlew. Using installed Gradle."
                gradle --no-daemon --no-build-cache --no-configuration-cache assembleDebug
              fi
            else
              echo "Wrapper generation failed. Falling back to installed Gradle."
              gradle --no-daemon --no-build-cache --no-configuration-cache assembleDebug
            fi
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="家族カレンダー (1)/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at: $APK_PATH"
            echo "Available APK files:"
            find "家族カレンダー (1)/app/build/outputs" -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-calendar-debug-apk
          path: 家族カレンダー (1)/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
