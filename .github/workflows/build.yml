name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          sdkmanager --list_installed
          adb version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Secrets Gradle Plugin template
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="家族カレンダー (1)"
          ENV_EXAMPLE="$PROJECT_DIR/.env.example"

          if [ ! -f "$ENV_EXAMPLE" ]; then
            echo "Creating the optional .env.example template required by the Secrets Gradle Plugin."
            printf '%s\\n' \
              '# Optional local development secrets.' \
              '# Keep real API keys in an untracked .env file or GitHub Actions secrets.' \
              'GEMINI_API_KEY=' > "$ENV_EXAMPLE"
          fi

          test -f "$ENV_EXAMPLE"
          echo ".env.example is present."

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="家族カレンダー (1)"
          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating the standard Android debug keystore for CI."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug keystore found."
          fi

          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="家族カレンダー (1)"
          cd "$PROJECT_DIR"

          echo "Project directory: $(pwd)"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          gradle --version

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found. Using ./gradlew."
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper script not found. Trying to generate it."
            if gradle wrapper --gradle-version 9.3.1 --distribution-type bin; then
              if [ -f "./gradlew" ]; then
                chmod +x ./gradlew
                ./gradlew --no-daemon assembleDebug
              else
                echo "Wrapper generation did not create gradlew. Using installed Gradle."
                gradle --no-daemon assembleDebug
              fi
            else
              echo "Wrapper generation failed. Falling back to installed Gradle."
              gradle --no-daemon assembleDebug
            fi
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="家族カレンダー (1)/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at: $APK_PATH"
            echo "Available APK files:"
            find "家族カレンダー (1)/app/build/outputs" -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-calendar-debug-apk
          path: 家族カレンダー (1)/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
